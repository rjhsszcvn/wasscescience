        s.style.transform = 'scale(1.03)';
        setTimeout(function(){ s.remove(); }, 520);
      };

        window.__hideSplash();
      }, 3500);

    <script>
      (function() {
        var CANONICAL_BASE = 'https://wasscescience.com';
        var NOINDEX_PATHS = [
          '/dashboard', '/quiz', '/exam', '/hub', '/leaderboard',
          '/notifications', '/profile', '/premium',
          '/reset-password', '/auth', '/admin',
          '/study-lounge', '/research'
        ];
        function updateCanonical() {
          var path = window.location.pathname;
          var canonical = document.getElementById('canonical-tag');
          if (canonical) {
            canonical.href = CANONICAL_BASE + (path === '/' ? '/' : path.replace(/\/$/, ''));
          }
          var robotsMeta = document.querySelector('meta[name="robots"]');
          if (robotsMeta) {
            var isNoIndex = NOINDEX_PATHS.some(function(p) {
              return path === p || path.startsWith(p + '/');
            });
            robotsMeta.content = isNoIndex ? 'noindex, nofollow' : 'index, follow';
          }
        }
        updateCanonical();
        var origPush = history.pushState;
        var origReplace = history.replaceState;
        history.pushState = function() { origPush.apply(this, arguments); updateCanonical(); };
        history.replaceState = function() { origReplace.apply(this, arguments); updateCanonical(); };
        window.addEventListener('popstate', updateCanonical);
      })();
    </script>
