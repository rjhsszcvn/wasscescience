[[headers]]
for = "/*"

[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
X-XSS-Protection = "1; mode=block"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://pagead2.googlesyndication.com https://www.googletagmanager.com https://www.google-analytics.com https://www.paypal.com https://www.paypalobjects.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://images.pexels.com https://*.supabase.co https://www.paypalobjects.com; connect-src 'self' https://*.supabase.co https://supabase.co wss://*.supabase.co https://www.google-analytics.com https://api.paypal.com https://api.sandbox.paypal.com; frame-src https://www.paypal.com https://www.sandbox.paypal.com; object-src 'none'; base-uri 'self'; form-action 'self';"
Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

[[headers]]
for = "/.well-known/assetlinks.json"

[headers.values]
Content-Type = "application/json"
Cache-Control = "public, max-age=3600"
Access-Control-Allow-Origin = "*"

[[headers]]
for = "/ads.txt"

[headers.values]
Content-Type = "text/plain; charset=utf-8"
Cache-Control = "public, max-age=86400"

[[headers]]
for = "/robots.txt"

[headers.values]
Content-Type = "text/plain; charset=utf-8"

[[headers]]
for = "/sitemap.xml"

[headers.values]
Content-Type = "application/xml; charset=utf-8"

[[headers]]
for = "/manifest.json"

[headers.values]
Content-Type = "application/manifest+json"
Cache-Control = "public, max-age=3600"

[[headers]]
for = "/sw.js"

[headers.values]
Cache-Control = "no-cache, no-store, must-revalidate"
Content-Type = "application/javascript"

[[headers]]
for = "/favicon.ico"

[headers.values]
Content-Type = "image/x-icon"
Cache-Control = "public, max-age=604800, immutable"

[[headers]]
for = "/favicon-*.png"

[headers.values]
Content-Type = "image/png"
Cache-Control = "public, max-age=604800, immutable"

[[headers]]
for = "/icons/*.png"

[headers.values]
Content-Type = "image/png"
Cache-Control = "public, max-age=604800, immutable"

[[headers]]
for = "/icons/*.svg"

[headers.values]
Content-Type = "image/svg+xml"
Cache-Control = "public, max-age=604800, immutable"

[[headers]]
for = "/download/*"

[headers.values]
Content-Disposition = "attachment"
Cache-Control = "public, max-age=86400"

[build]
command = "npx vite build"
publish = "dist"

[[redirects]]
from = "https://www.wasscescience.com/*"
to = "https://wasscescience.com/:splat"
status = 301
force = true

[[redirects]]
from = "http://www.wasscescience.com/*"
to = "https://wasscescience.com/:splat"
status = 301
force = true

[[redirects]]
from = "http://wasscescience.com/*"
to = "https://wasscescience.com/:splat"
status = 301
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
