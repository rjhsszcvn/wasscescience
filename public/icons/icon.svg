<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000814" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <clipPath id="round-clip">
      <rect width="512" height="512" rx="108" ry="108"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="108" ry="108" fill="url(#bg-grad)" filter="url(#drop)"/>

  <rect width="512" height="512" rx="108" ry="108" fill="url(#shine)"/>

  <rect x="1" y="1" width="510" height="510" rx="107" ry="107" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>

  <g clip-path="url(#round-clip)">
    <rect x="108" y="130" width="132" height="240" rx="12" fill="white" opacity="0.14"/>
    <rect x="272" y="130" width="132" height="240" rx="12" fill="white" opacity="0.14"/>
    <rect x="246" y="126" width="20" height="248" rx="6" fill="white" opacity="0.28"/>

    <rect x="128" y="168" width="94" height="10" rx="5" fill="white" opacity="0.75"/>
    <rect x="128" y="190" width="80" height="8" rx="4" fill="white" opacity="0.48"/>
    <rect x="128" y="210" width="88" height="8" rx="4" fill="white" opacity="0.48"/>
    <rect x="128" y="230" width="68" height="8" rx="4" fill="white" opacity="0.38"/>
    <rect x="128" y="252" width="84" height="7" rx="3.5" fill="white" opacity="0.32"/>
    <rect x="128" y="270" width="72" height="7" rx="3.5" fill="white" opacity="0.32"/>
    <rect x="128" y="288" width="80" height="7" rx="3.5" fill="white" opacity="0.28"/>

    <rect x="290" y="168" width="94" height="10" rx="5" fill="white" opacity="0.75"/>
    <rect x="290" y="190" width="80" height="8" rx="4" fill="white" opacity="0.48"/>
    <rect x="290" y="210" width="70" height="8" rx="4" fill="white" opacity="0.48"/>
    <rect x="290" y="230" width="85" height="8" rx="4" fill="white" opacity="0.38"/>

    <circle cx="338" cy="306" r="52" fill="url(#accent-grad)" opacity="0.95" filter="url(#glow)"/>
    <circle cx="338" cy="306" r="52" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

    <ellipse cx="338" cy="306" rx="42" ry="18" fill="none" stroke="white" stroke-width="2.8" opacity="0.92"/>
    <ellipse cx="338" cy="306" rx="42" ry="18" fill="none" stroke="white" stroke-width="2.8" opacity="0.92" transform="rotate(60 338 306)"/>
    <ellipse cx="338" cy="306" rx="42" ry="18" fill="none" stroke="white" stroke-width="2.8" opacity="0.92" transform="rotate(120 338 306)"/>
    <circle cx="338" cy="306" r="9" fill="white"/>
    <circle cx="338" cy="306" r="5" fill="#38bdf8"/>
  </g>
</svg>
